name: Calabar Connect City build check

on:
  push:
    branches:
      - auth-admin-seo-mentions-20261014
  pull_request:
    branches:
      - main
      - auth-admin-seo-mentions-20261014

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build production bundle
        run: npm run build
