name: Build Calabar Connect City
on:
  push:
    branches: [main, calabar-connect-city-live-fixes-20261014]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Type-check TypeScript
        run: npx tsc --noEmit --jsx react-jsx --target ES2020 --module ESNext --moduleResolution bundler --skipLibCheck --types vite/client src/main.tsx
      - name: Build production bundle
        run: npm run build
