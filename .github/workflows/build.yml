name: Build Calabar Connect City
on:
  push:
    branches: [main, auth-admin-seo-mentions-20261014]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Type-check TypeScript
        run: npx tsc --noEmit
      - name: Build production bundle
        run: npm run build
