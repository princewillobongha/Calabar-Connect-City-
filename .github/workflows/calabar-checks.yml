name: Calabar Connect City checks
on:
  push:
    branches:
      - auth-admin-seo-mentions-20261014
  pull_request:
    branches:
      - main
jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build
